name: Sprint 02 - Validacion funcional MySQL

on:
  push:
    branches:
      - sprint/02-nucleo-funcional
  workflow_dispatch:

jobs:
  validar-sprint-02:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: control_asistencia
      DB_USER: app
      DB_PASSWORD: app_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: control_asistencia
          MYSQL_USER: app
          MYSQL_PASSWORD: app_local_password
          MYSQL_ROOT_PASSWORD: root_local_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_local_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas unitarias
        run: npm test
      - name: Crear esquema y datos de demostracion
        run: |
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -p"$MYSQL_ROOT_PASSWORD" < database/schema.sql
          docker exec -i "${{ job.services.mysql.id }}" mysql -uroot -p"$MYSQL_ROOT_PASSWORD" < database/seed.sql
      - name: Ejecutar pruebas de integracion MySQL
        run: npm run test:db
      - name: Comprobar arranque y pantalla de login
        shell: bash
        run: |
          node src/server.js > app-start.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for intento in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/login | grep -F "Control de asistencia"; then
              grep -F "Conexión con MySQL comprobada" app-start.log
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then cat app-start.log; exit 1; fi
            sleep 1
          done
          cat app-start.log
          exit 1
