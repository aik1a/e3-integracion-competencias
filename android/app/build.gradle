plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.aikia.asistencia'
    compileSdk 36

    defaultConfig {
        applicationId 'cl.aikia.asistencia'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'SERVER_URL', '"http://10.0.2.2:3000"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
